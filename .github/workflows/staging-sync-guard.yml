name: Staging Sync Guard

on:
  push:
    branches:
      - staging  # Triggers whenever a push or merge occurs on the staging branch

jobs:
  audit-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit Open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Update remote staging branch and extract its latest commit SHA
          git fetch origin staging
          STAGING_HEAD=$(git rev-parse origin/staging)
          echo "🚀 Latest Remote Staging Head SHA: $STAGING_HEAD"
          echo "------------------------------------------------"
          
          # 2. Fetch PRs (Exclude any author whose login name contains 'dependabot' using jq case-insensitive test)
          PR_LIST=$(gh pr list --state open --json number,baseRefName,headRefName,headRefOid,author --jq '.[] | select((.baseRefName=="qa" or .baseRefName=="staging") and (.author.login | test("dependabot"; "i") | not)) | "\(.number)|\(.baseRefName)|\(.headRefName)|\(.headRefOid)|\(.author.login)"')
          
          if [ -z "$PR_LIST" ]; then
            echo "✅ No target PRs to audit at this time."
            exit 0
          fi
          
          # 3. Loop through each PR to track branch lineage
          echo "$PR_LIST" | while IFS='|' read -r pr_number pr_base pr_head pr_oid pr_author; do
            # [Double Safety Guard] Explicitly skip the loop if the author name contains 'dependabot'
            if [[ "$pr_author" == *"dependabot"* ]]; then
              echo "箱 PR #$pr_number skipped (Reason: Created by Dependabot)"
              continue
            fi

            echo "🔍 Auditing: PR #$pr_number [ $pr_head -> $pr_base ] (Author: $pr_author)"
            echo "   PR Head Commit OID: $pr_oid"
            
            # Safely fetch the target feature branch from remote
            git fetch origin $pr_head:$pr_head
            
            # Verify if the latest staging commit ($STAGING_HEAD) is an ancestor of the PR head commit ($pr_oid)
            if git merge-base --is-ancestor $STAGING_HEAD $pr_oid; then
              echo "  ✅ Up to date with the latest staging branch."
            else
              echo "  ❌ [Warning] Stale status detected!"
              gh pr comment $pr_number --body "⚠️ Notice: New code has been merged into staging, making this branch stale. To avoid any merge conflicts, please merge or rebase the latest staging branch! 🙏"
            fi
            echo "------------------------------------------------"
          done
