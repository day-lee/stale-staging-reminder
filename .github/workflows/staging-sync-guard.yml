name: Staging Sync Guard

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제 댓글을 달지 않고 로그만 확인하려면 true로 설정하세요'
        required: true
        default: 'true'

jobs:
  audit-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Audit Open PRs for Staging Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # 💡 수동 트리거일 때만 입력값을 전달하고, push일 때는 공백이 들어옵니다.
          MY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          echo "🚀 Starting Staging Sync Guard (Strict Up-to-date Policy)"
          echo "📍 Current Repository Context: '$CURRENT_REPO'"
          echo "📍 Raw Trigger Event: '$EVENT_NAME'"
          echo "'$MY_DRY_RUN'"
          echo "------------------------------------------------"
          
          
          # 1. ⚙️ [모드 판별 안전장치 - 완벽 패치]
          # 오직 수동 트리거(workflow_dispatch)이면서 명시적으로 true를 입력했을 때만 무알림 모드 발동
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${MY_DRY_RUN,,}" = "true" ]; then
            IS_DRY_RUN="true"
            echo "⚙️ Mode: [DRY-RUN] 실제 댓글을 달지 않고 로그만 출력합니다."
          else
            IS_DRY_RUN="false"
            echo "⚙️ Mode: [PRODUCTION] 뒤처진 PR 발견 시 실제 알림 댓글을 작성합니다."
          fi
          echo "------------------------------------------------"
          
          # 2. 원격 staging 브랜치의 최신 커밋 SHA 확보
          STAGING_HEAD=$(gh api repos/$CURRENT_REPO/branches/staging --jq '.commit.sha')
          echo "📍 Current Staging Latest SHA: $STAGING_HEAD"
          echo "------------------------------------------------"
          
          # 3. qa 브랜치를 타깃으로 하는 open PR 목록 추출 (Dependabot 제외)
          # 💡 [해결]: --repo 옵션을 명시하여 .git 폴더가 없어도 원격에서 PR 목록을 정확히 가져옵니다.
          PR_JSON=$(gh pr list --repo $CURRENT_REPO --state open --json number,baseRefName,headRefName,headRefOid,author,headRepositoryOwner \
            --jq '[.[] | select((.baseRefName=="qa") and (.author.login | test("dependabot"; "i") | not))]')
          
          PR_COUNT=$(echo "$PR_JSON" | jq '. | length')
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "✅ No target open PRs destination to 'qa' at this time."
            exit 0
          fi
          
          # 4. 안전하게 인덱스 기반으로 PR 순회
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR=$(echo "$PR_JSON" | jq ".[$i]")
            
            pr_number=$(echo "$PR" | jq -r '.number')
            pr_base=$(echo "$PR" | jq -r '.baseRefName')
            pr_head=$(echo "$PR" | jq -r '.headRefName')
            pr_oid=$(echo "$PR" | jq -r '.headRefOid')
            pr_author=$(echo "$PR" | jq -r '.author.login')
            head_owner=$(echo "$PR" | jq -r '.headRepositoryOwner.login')

            echo "🔍 Auditing: PR #$pr_number [ $pr_head -> $pr_base ] (Author: $pr_author)"
            
            # 5. GitHub API를 통해 staging 최신 커밋이 PR 브랜치의 히스토리에 포함되어 있는지 확인
            SYNC_STATUS=$(gh api repos/$CURRENT_REPO/compare/${STAGING_HEAD}...${head_owner}:${pr_oid} --jq '.status' 2>/dev/null || echo "unknown")
            
            if [ "$SYNC_STATUS" = "identical" ] || [ "$SYNC_STATUS" = "ahead" ]; then
              echo "  ✅ Up to date with the latest staging branch. (Status: $SYNC_STATUS)"
            else
              echo "  ❌ [Warning] Stale status detected! (Status: $SYNC_STATUS)"
              
              # 6. 완벽하게 판별된 IS_DRY_RUN 변수를 기반으로 분기 처리
              if [ "$IS_DRY_RUN" = "true" ]; then
                echo "  📝 [Dry-Run LOG] 실제 환경이었다면 PR #$pr_number 에 리베이스 권장 댓글을 남겼을 것입니다."
              else
                COMMENT_BODY="⚠️ **Stale Branch Notice**: New code has recently been merged into the staging branch. Please update your branch using one of the following methods:

                1. **Rebase** your branch on top of the latest staging.
                2. **Re-create** your branch from the latest staging and **cherry-pick** your commits. 🙏"

                gh pr comment $pr_number --repo $CURRENT_REPO --body "$COMMENT_BODY"
                echo "  💬 Sync warning comment posted successfully to PR #$pr_number."
              fi
            fi
            echo "------------------------------------------------"
          done
