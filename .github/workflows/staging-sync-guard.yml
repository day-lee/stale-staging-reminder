name: Staging Sync Guard

on:
  push:
    branches:
      - staging  # staging에 머지(푸시)가 일어났을 때 트리거

jobs:
  audit-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Audit Open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 원격 staging 브랜치 최신화 및 해시 추출
          git fetch origin staging
          STAGING_HEAD=$(git rev-parse origin/staging)
          echo "🚀 Latest Remote Staging Head SHA: $STAGING_HEAD"
          echo "------------------------------------------------"
          
          # 2. 제공해주신 필드 목록(headRefOid, author, baseRefName 등)을 정확히 매핑하여 PR 추출
          PR_LIST=$(gh pr list --state open --json number,baseRefName,headRefName,headRefOid,author --jq '.[] | select((.baseRefName=="qa" or .baseRefName=="staging") and .author.login != "dependabot[bot]") | "\(.number)|\(.baseRefName)|\(.headRefName)|\(.headRefOid)"')
          
          if [ -z "$PR_LIST" ]; then
            echo "✅ 현재 검사할 대상 PR이 없습니다."
            exit 0
          fi
          
          # 3. 각 PR별 계보 추적 루프
          echo "$PR_LIST" | while IFS='|' read -r pr_number pr_base pr_head pr_oid; do
            echo "🔍 검사 중: PR #$pr_number [ $pr_head -> $pr_base ]"
            echo "   PR Head Commit OID: $pr_oid"
            
            # 대상 feature 브랜치를 원격에서 안전하게 가져옴
            git fetch origin $pr_head:$pr_head
            
            # staging의 최신 커밋($STAGING_HEAD)이 해당 PR의 커밋($pr_oid) 역사에 포함되어 있는지 검증
            if git merge-base --is-ancestor $STAGING_HEAD $pr_oid; then
              echo "  ✅ 최신 staging 상태를 잘 유지하고 있습니다."
            else
              echo "  ❌ [경고] Stale 상태 감지됨!"
              gh pr comment $pr_number --body "⚠️ Notice: New code has been merged into staging, making this branch stale. To avoid any merge conflicts, please merge or rebase the latest staging branch! 🙏"
            fi
            echo "------------------------------------------------"
          done
