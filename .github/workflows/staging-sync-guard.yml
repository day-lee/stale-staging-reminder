name: Staging Sync Guard

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to true to verify the logs only without posting actual comments'
        required: true
        default: 'true'

jobs:
  audit-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Audit Open PRs for Staging Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Safely forward the original text to prevent system variable naming conflicts
          MY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          echo "🚀 Starting Staging Sync Guard (Strict Up-to-date Staging Policy)"
          echo "📍 Current Repository Context: '$CURRENT_REPO'"
          echo "📍 Raw Trigger Event: '$EVENT_NAME'"
          echo "------------------------------------------------"
          
          # 1. Mode Evaluation Safeguard
          # Convert incoming string to lowercase to handle both 'True' and 'true' seamlessly
          DRY_RUN_LOWER=$(echo "${MY_DRY_RUN,,}")
          
          # Activate dry-run mode only if manually triggered and explicitly set to true
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_LOWER" = "true" ]; then
            IS_DRY_RUN="true"
            echo "⚙️ Mode: [DRY-RUN] Executing log-only mode. No comments will be published."
          else
            IS_DRY_RUN="false"
            echo "⚙️ Mode: [PRODUCTION] Live mode active. Stale PRs will receive warning comments."
          fi
          echo "------------------------------------------------"
          
          # 2. Fetch the latest commit SHA of the remote staging branch
          STAGING_HEAD=$(gh api repos/$CURRENT_REPO/branches/staging --jq '.commit.sha')
          echo "📍 Current Staging Latest SHA: $STAGING_HEAD"
          echo "------------------------------------------------"
          
          # 3. Extract open PRs targeting the 'qa' branch (excluding Dependabot)
          # Explicitly pass the --repo flag to ensure the CLI operates seamlessly without a local .git directory
          PR_JSON=$(gh pr list --repo $CURRENT_REPO --state open --json number,baseRefName,headRefName,headRefOid,author,headRepositoryOwner \
            --jq '[.[] | select((.baseRefName=="qa") and (.author.login | test("dependabot"; "i") | not))]')
          
          PR_COUNT=$(echo "$PR_JSON" | jq '. | length')
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "✅ No target open PRs destined for 'qa' at this time."
            exit 0
          fi
          
          # 4. Safely iterate through the PR array using index-based loop
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR=$(echo "$PR_JSON" | jq ".[$i]")
            
            pr_number=$(echo "$PR" | jq -r '.number')
            pr_base=$(echo "$PR" | jq -r '.baseRefName')
            pr_head=$(echo "$PR" | jq -r '.headRefName')
            pr_oid=$(echo "$PR" | jq -r '.headRefOid')
            pr_author=$(echo "$PR" | jq -r '.author.login')
            head_owner=$(echo "$PR" | jq -r '.headRepositoryOwner.login')

            echo "🔍 Analysing: PR #$pr_number [ $pr_head -> $pr_base ] (Author: $pr_author)"
            
            # 5. Utilise the GitHub Compare API to verify if the latest staging commit is an ancestor of the PR head
            SYNC_STATUS=$(gh api repos/$CURRENT_REPO/compare/${STAGING_HEAD}...${head_owner}:${pr_oid} --jq '.status' 2>/dev/null || echo "unknown")
            
            if [ "$SYNC_STATUS" = "identical" ] || [ "$SMS_STATUS" = "ahead" ] || [ "$SYNC_STATUS" = "identical" ]; then
              echo "  ✅ Up to date with the latest staging branch. (Status: $SYNC_STATUS)"
            else
              echo "  ❌ [Warning] Stale status detected! (Status: $SYNC_STATUS)"
              
              # 6. Branch execution based on the evaluated dry-run status
              if [ "$IS_DRY_RUN" = "true" ]; then
                echo "  📝 [Dry-Run LOG] A rebase recommendation comment would have been posted to PR #$pr_number."
              else
                COMMENT_BODY="⚠️ **Stale Branch Notice**: New code has recently been merged into the staging branch. Please update your branch using one of the following methods:
                1. **Rebase** your branch on top of the latest staging.
                2. **Re-create** your branch from the latest staging and **cherry-pick** your commits. 🙏"

                gh pr comment $pr_number --repo $CURRENT_REPO --body "$COMMENT_BODY"
                echo "  💬 Sync warning comment posted successfully to PR #$pr_number."
              fi
            fi
            echo "------------------------------------------------"
          done
